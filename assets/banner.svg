<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Nabta, Grow with Confidence. An end-to-end product design case study." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#122F13"/><stop offset="1" stop-color="#19421B"/></linearGradient></defs>
<style>
text{font-family:'Plus Jakarta Sans','Segoe UI',Helvetica,Arial,sans-serif}
.n{stroke-dasharray:1 1;animation:draw 2.6s .4s ease-out both}
@keyframes draw{0%{stroke-dashoffset:1;opacity:0}2%{opacity:1}100%{stroke-dashoffset:0;opacity:1}}
.dot{transform-box:fill-box;transform-origin:center;animation:pop .7s 2.8s cubic-bezier(.3,1.8,.5,1) both}
@keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
.fl{transform-box:fill-box;transform-origin:center;animation:fl 7s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-14px) rotate(14deg)}}
.t{opacity:0;animation:up .9s ease-out forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}.n{stroke-dashoffset:0}}
</style>
